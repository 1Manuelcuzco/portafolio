name: Publicar portafolio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      avisar_para_ti:
        description: Enviar los anuncios nuevos de Para ti después de publicar
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar portafolio
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

  avisar-para-ti:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.avisar_para_ti && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Obtener código de esta publicación
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar publicación y enviar novedades
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/enviar-para-ti.mjs
